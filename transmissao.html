<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/icons/pascom-icon.png" type="image/png" />
    <title>PASCOM - NSAP</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        /* Cardo, Montserrat, Poppins */

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        * {
            transition: all 0.2s;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            background: linear-gradient(-45deg, #5281ee, #1d3473, #202f49, #2367d5);
            /* background: linear-gradient(-45deg, #4166bd, #13234d, #101824, #1c53ac); */
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 700% 700%;
            animation: gradientAnimation 15s ease infinite;
        }

        main {
            margin-top: 0px;

            max-width: 90%;
            overflow-x: hidden;
        }

        .pagina-principal {
            color: white;
            font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 20px 0px 0px 0px;

            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: row;
            gap: 5px;
        }

        .pagina-principal img {
            height: auto;
            width: 15px;
            filter: invert(1);
        }
    </style>

</head>

<body>
    <a href="index.html" class="pagina-principal">Página principal <img src="images/icons/link-externo.png"
            alt="link-externo.png"></a>

    <header>
        <nav>

        </nav>
    </header>

    <main>
        <section>
            <article>

            </article>
        </section>
    </main>

    <footer>

    </footer>

    <script>

</body>

</html>
